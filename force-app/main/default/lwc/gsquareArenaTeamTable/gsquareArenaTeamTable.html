<template>
  <table class="team">
    <thead>
      <tr>
        <th></th>
        <th>Allocation</th>
        <th>SV sch</th>
        <th>SV cond</th>
        <th>Booking</th>
        <th>Talktime</th>
        <template lwc:if={showPace}><th>SV cond pace</th></template>
      </tr>
    </thead>
    <tbody>
      <template for:each={views} for:item="r">
        <tr key={r.id}>
          <td class="lbl">{r.label}</td>
          <td class="num" data-k="allocation">{r.allocation}</td>
          <td class="num" data-k="svScheduled">{r.svScheduled}</td>
          <td class="num" data-k="svConducted">{r.svConducted}</td>
          <td class="num" data-k="booking">{r.booking}</td>
          <td class="num" data-k="talktime">{r.talktimeText}</td>
          <template lwc:if={showPace}
            ><td class={r.paceClass}>{r.paceText}</td></template
          >
        </tr>
      </template>
    </tbody>
  </table>
</template>
