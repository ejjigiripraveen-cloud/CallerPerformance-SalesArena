<template>
  <div class={boardClass}>
    <template for:each={columns} for:item="col">
      <div key={col.key} class="col">
        <template for:each={col.rows} for:item="r">
          <div key={r.id} class={r.rowClass}>
            <span class="rk num">{r.rank}</span>
            <template lwc:if={r.photoUrl}>
              <img class="av" src={r.photoUrl} alt="" />
            </template>
            <template lwc:else>
              <span class="av">{r.initials}</span>
            </template>
            <span class="who"
              ><span class="nm">{r.name}</span
              ><span class="tl">{r.subLabel}</span></span
            >
            <span class={r.mvClass}>{r.mvText}</span>
            <span class={r.valClass}>{r.valText}</span>
          </div>
        </template>
      </div>
    </template>
  </div>
</template>
