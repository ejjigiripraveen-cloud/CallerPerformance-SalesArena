<template>
  <div class={fitClass} lwc:ref="fit">
  <div class={tvClass} style={tvStyle}>
    <template lwc:if={isReady}>
      <div class="screen" style={screenStyle}>
        <c-gsquare-arena-hero
          class="band-hero"
          zone-name={zoneName}
          clock-text={clockText}
          ampm={ampm}
          date-text={dateText}
          tiles={heroTiles}
          updated-text={updatedText}
          stale-state={staleState}
        ></c-gsquare-arena-hero>
        <div class="scene">
          <div class="shead">
            <div class="stitle">{sceneTitle}</div>
            <div class="ssub">{sceneSubtitle}</div>
            <div class="dots">
              <template for:each={progressDots} for:item="d">
                <i key={d.key} class={d.cls}></i>
              </template>
            </div>
          </div>
          <div class="bar"><b style={progressStyle}></b></div>
          <div class="sbody">
            <template lwc:if={isBoardScene}>
              <c-gsquare-arena-board
                rows={boardRows}
                variant={boardVariant}
                unit={boardUnit}
              ></c-gsquare-arena-board>
            </template>
            <template lwc:elseif={isTeamScene}>
              <c-gsquare-arena-team-table
                rows={teamTableRows}
                show-pace={showPace}
              ></c-gsquare-arena-team-table>
            </template>
            <template lwc:elseif={isWatchlistScene}>
              <c-gsquare-arena-watchlist
                rows={watchRows}
              ></c-gsquare-arena-watchlist>
            </template>
          </div>
        </div>
        <c-gsquare-arena-zone-race
          class="band-race"
          entries={raceEntries}
          current-zone={zoneParam}
        ></c-gsquare-arena-zone-race>
      </div>
      <template lwc:if={activeBooking}>
        <c-gsquare-arena-takeover
          booking={activeBooking}
        ></c-gsquare-arena-takeover>
      </template>
    </template>
    <template lwc:elseif={isLoading}>
      <div class="notice">Loading {zoneParam}</div>
    </template>
    <template lwc:else>
      <div class="notice">Choose a zone from the menu at the top right.</div>
    </template>
    <template lwc:if={showZonePicker}>
      <div class="tools">
        <button class="tool" title="Zoom out" aria-label="Zoom out" onclick={zoomOut}>&minus;</button>
        <button class="tool tool-fit" title="Fit to screen" aria-label="Fit to screen" onclick={zoomFit}>{zoomLabel}</button>
        <button class="tool" title="Zoom in" aria-label="Zoom in" onclick={zoomIn}>+</button>
        <button class="tool" title={expandTitle} aria-label={expandTitle} onclick={toggleExpanded}>&#x26F6;</button>
      <label class="zone-pick">
        <span class="zone-pick-label">Zone</span>
        <select
          class="zone-pick-select"
          aria-label="Zone"
          onchange={handleZoneChange}
        >
          <option value="" disabled selected={noZoneSelected}>
            Choose zone
          </option>
          <template for:each={zoneChoices} for:item="z">
            <option key={z.value} value={z.value} selected={z.selected}>
              {z.value}
            </option>
          </template>
        </select>
      </label>
      </div>
    </template>
  </div>
  </div>
</template>
